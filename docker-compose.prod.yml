# Production-only compose file.
# Pulls the pre-built GHCR image — never builds locally.
#
# Usage on EC2:
#   docker compose -f docker-compose.prod.yml pull jobradar
#   docker compose -f docker-compose.prod.yml up -d --remove-orphans
#
# Verify the running image:
#   docker inspect -f '{{.Config.Image}}' jobradar
#   # expected: ghcr.io/manasjoshi1/jobradar:latest
#
# Health check:
#   curl -fsS http://localhost/api/health

services:
  jobradar:
    image: ghcr.io/manasjoshi1/jobradar:latest
    container_name: jobradar
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: "file:/app/data/jobradar.db"
      NODE_ENV: "production"
      NODE_OPTIONS: "--max-old-space-size=640"
      ENABLE_SCHEDULER: "true"
      # ── Workday scraper (Chromium) ──────────────────────────────────────────
      # Browser is baked into the image; this flag is the runtime on/off switch.
      # Only sources promoted to scraper_candidate/scraper_valid are ever scraped.
      WORKDAY_SCRAPER_ENABLED: "true"
      # Hard cap on concurrent Chromium instances — keep at 1 on this box.
      WORKDAY_SCRAPER_CONCURRENCY: "1"
      PLAYWRIGHT_CHROMIUM_PATH: "/usr/bin/chromium-browser"
    ports:
      # Bind to loopback only — nginx proxies public traffic on port 80/443.
      - "127.0.0.1:3000:3000"
    volumes:
      - ./data:/app/data
    # Raised from 750m to give Chromium headroom alongside the 640m Node heap.
    # Host has 1.9G RAM + 2G swap; memswap allows brief spillover during scrapes.
    mem_limit: 1500m
    memswap_limit: 2500m
