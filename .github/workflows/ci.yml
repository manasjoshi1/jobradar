name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ── Job 1: Lint + Build + E2E ────────────────────────────────────────────
  test:
    name: Lint · Build · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      # ── E2E database isolated from any production DB ─────────────────────
      DATABASE_URL: "file:./prisma/e2e.db"

      # ── Auth / sessions ──────────────────────────────────────────────────
      SESSION_SECRET: "ci-e2e-session-secret-minimum-32-chars-xx"
      COOKIE_SECURE: "false"

      # ── Disable scheduler & external notifications ───────────────────────
      ENABLE_SCHEDULER: "false"
      NOTIFICATIONS_ENABLED: "false"
      ALL_NEW_JOBS_NOTIFICATIONS_ENABLED: "false"
      NOTIFICATION_CHANNEL: "none"

      # ── E2E mode flags ────────────────────────────────────────────────────
      NODE_ENV: "test"
      E2E_TEST: "true"

      # ── Point at fixture config, not production YAML ──────────────────────
      CONFIG_DIR: "./config/e2e"

      # ── Sync config for CI startup stability ──────────────────────────────
      SYNC_FETCH_CONCURRENCY: "2"
      SYNC_DB_CONCURRENCY: "1"
      SOURCE_FETCH_TIMEOUT_MS: "3000"
      SOURCE_FETCH_RETRIES: "0"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Create E2E database
        run: |
          rm -f prisma/e2e.db
          npx prisma migrate deploy

      - name: Seed E2E data
        run: node scripts/e2e-seed.mjs

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run ci:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # ── Job 2: Docker build + publish ────────────────────────────────────────
  # Gated on test — image is only pushed after lint/build/E2E pass.
  docker-build:
    name: Docker build · publish
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [test]

    permissions:
      contents: read
      packages: write   # needed to push to ghcr.io

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        # Only log in when we will actually push (push to main/master).
        # PRs skip this step — GITHUB_TOKEN on forks cannot push to the org registry.
        if: ${{ github.event_name == 'push' }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/manasjoshi1/jobradar
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'push' }}
            type=sha,prefix=sha-,format=short,enable=${{ github.event_name == 'push' }}

      - name: Build Docker image (and push on main)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: ${{ github.event_name == 'push' }}
          tags: ${{ github.event_name == 'push' && steps.meta.outputs.tags || 'jobradar:ci' }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Job 3: Deploy to EC2 ─────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 45

    needs: [test, docker-build]

    # Only deploy after successful CI on push.
    # Pull requests must never deploy.
    if: ${{ github.event_name == 'push' }}

    # IMPORTANT:
    # Do not use secrets inside environment.url.
    # GitHub Actions rejects secrets in that expression context.
    environment:
      name: production

    steps:
      - name: Check deploy secrets
        id: deploy_secrets
        shell: bash
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_APP_DIR: ${{ secrets.EC2_APP_DIR }}
        run: |
          missing="false"

          if [ -z "$EC2_HOST" ]; then
            echo "Missing secret: EC2_HOST"
            missing="true"
          fi

          if [ -z "$EC2_USER" ]; then
            echo "Missing secret: EC2_USER"
            missing="true"
          fi

          if [ -z "$EC2_SSH_KEY" ]; then
            echo "Missing secret: EC2_SSH_KEY"
            missing="true"
          fi

          if [ -z "$EC2_APP_DIR" ]; then
            echo "Missing secret: EC2_APP_DIR"
            missing="true"
          fi

          if [ "$missing" = "true" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets are incomplete. Skipping EC2 deploy."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "Deploy secrets are present."
          fi

      - name: Deploy to EC2
        if: ${{ steps.deploy_secrets.outputs.ready == 'true' }}
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            COMPOSE="docker compose -f docker-compose.prod.yml"

            echo "==> Deploying to $APP_DIR"
            cd "$APP_DIR"

            echo "==> Fetching latest code (includes docker-compose.prod.yml)..."
            git fetch origin
            git reset --hard FETCH_HEAD

            echo "==> Pulling GHCR image..."
            $COMPOSE pull jobradar

            echo "==> Restarting container from pulled image..."
            $COMPOSE up -d --remove-orphans

            echo "==> Waiting for container to become ready..."
            sleep 15

            echo "==> Verify running image (must be ghcr.io, not local build)..."
            docker inspect -f '{{.Config.Image}}' jobradar

            echo "==> Running deploy bootstrap..."
            $COMPOSE exec -T jobradar npm run deploy:bootstrap

            echo "==> Container status:"
            $COMPOSE ps

            echo "==> Health check..."
            HTTP_CODE=$(curl -fsS -o /dev/null -w "%{http_code}" http://localhost/api/health || echo "000")

            if [ "$HTTP_CODE" != "200" ]; then
              echo "ERROR: /api/health returned HTTP $HTTP_CODE (expected 200)"
              exit 1
            fi

            echo "==> Deploy complete! /api/health → HTTP $HTTP_CODE"
