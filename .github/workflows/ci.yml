name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  # ── Job 1: Lint + Build + E2E ────────────────────────────────────────────
  test:
    name: Lint · Build · E2E
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      # ── E2E database (isolated from any production DB) ──────────────────
      DATABASE_URL: "file:./prisma/e2e.db"
      # ── Auth / sessions ──────────────────────────────────────────────────
      SESSION_SECRET: "ci-e2e-session-secret-minimum-32-chars-xx"
      COOKIE_SECURE: "false"
      # ── Disable scheduler & external notifications ───────────────────────
      ENABLE_SCHEDULER: "false"
      NOTIFICATIONS_ENABLED: "false"
      ALL_NEW_JOBS_NOTIFICATIONS_ENABLED: "false"
      NOTIFICATION_CHANNEL: "none"
      # ── E2E mode flags ────────────────────────────────────────────────────
      NODE_ENV: "test"
      E2E_TEST: "true"
      # ── Point at fixture config, not production YAML ──────────────────────
      CONFIG_DIR: "./config/e2e"
      # ── Sync (unused in E2E but silences startup warnings) ────────────────
      SYNC_FETCH_CONCURRENCY: "2"
      SYNC_DB_CONCURRENCY: "1"
      SOURCE_FETCH_TIMEOUT_MS: "3000"
      SOURCE_FETCH_RETRIES: "0"

    steps:
      # ── 1. Checkout ───────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Node.js setup with npm cache ───────────────────────────────────
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # ── 3. Install dependencies ───────────────────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 4. Generate Prisma client ─────────────────────────────────────────
      - name: Generate Prisma client
        run: npx prisma generate

      # ── 5. Lint ───────────────────────────────────────────────────────────
      - name: Lint
        run: npm run lint

      # ── 6. TypeScript build (also validates schema) ───────────────────────
      - name: Build
        run: npm run build

      # ── 7. Validate Prisma schema ─────────────────────────────────────────
      - name: Validate Prisma schema
        run: npx prisma validate

      # ── 8. Create E2E SQLite DB ───────────────────────────────────────────
      - name: Create E2E database
        run: |
          rm -f prisma/e2e.db
          npx prisma migrate deploy

      # ── 9. Seed E2E data ──────────────────────────────────────────────────
      - name: Seed E2E data
        run: node scripts/e2e-seed.mjs

      # ── 10. Install Playwright browsers (Chromium only) ───────────────────
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      # ── 11. Run E2E tests (app started by start-server-and-test) ──────────
      - name: Run E2E tests
        run: npm run ci:e2e

      # ── 12. Upload Playwright report & artifacts on failure ───────────────
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Upload test results (traces / screenshots / videos)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  # ── Job 2: Docker build validation ───────────────────────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: jobradar:ci
          # Use layer cache from the GitHub Actions cache
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # Dockerfile sets NODE_ENV=production in the runner stage directly

  # ── Job 3: Deploy to EC2 ─────────────────────────────────────────────────
  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Both CI jobs must be green before we touch production
    needs: [test, docker-build]

    # Only deploy on push events — never on pull_request
    # (pull_request events from forks don't have access to secrets anyway,
    #  but the explicit guard makes intent clear and prevents accidental deploys)
    if: github.event_name == 'push'

    environment:
      name: production
      url: http://${{ secrets.EC2_HOST }}

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host:     ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key:      ${{ secrets.EC2_SSH_KEY }}
          # Abort the entire script on the first failing command
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.EC2_APP_DIR }}"
            echo "==> Deploying to $APP_DIR"
            cd "$APP_DIR"

            # ── 1. Pull latest code ──────────────────────────────────────────
            # git reset --hard is safe: .env and data/ are not tracked by git.
            # The SQLite volume (./data) and secrets (.env) are never touched.
            echo "==> Fetching latest code..."
            git fetch origin
            git reset --hard FETCH_HEAD

            # ── 2. Rebuild image and restart container ───────────────────────
            echo "==> Building Docker image and restarting container..."
            docker compose up --build -d

            # ── 3. Wait for container to initialise ──────────────────────────
            echo "==> Waiting 15 s for container to become ready..."
            sleep 15

            # ── 4. Run idempotent bootstrap (migrations, config, backfill) ───
            echo "==> Running deploy bootstrap..."
            docker compose exec -T jobradar npm run deploy:bootstrap

            # ── 5. Confirm container is running ──────────────────────────────
            echo "==> Container status:"
            docker compose ps

            # ── 6. Health checks ─────────────────────────────────────────────
            # /api/auth/me returns 401 when unauthenticated — that's expected
            # and still proves the Next.js server is alive and routing correctly.
            echo "==> Health check: Next.js API..."
            curl -sf http://localhost/api/auth/me \
              -o /dev/null -w "HTTP %{http_code}\n" || true

            echo "==> Health check: nginx / root..."
            curl -sf http://localhost -o /dev/null -w "HTTP %{http_code}\n"

            # Hard fail if the root returns a non-2xx/3xx (nginx is down)
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" http://localhost)
            if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 500 ]; then
              echo "ERROR: health check failed — HTTP $HTTP_CODE"
              exit 1
            fi

            echo "==> Deploy complete! HTTP $HTTP_CODE"
