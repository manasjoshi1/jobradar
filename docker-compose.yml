services:
  jobradar:
    build: .
    container_name: jobradar
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Non-secret runtime defaults — override in .env for production
      DATABASE_URL: "file:/app/data/jobradar.db"
      NODE_ENV: "production"
      NODE_OPTIONS: "--max-old-space-size=384"
      CONFIG_DIR: "/app/config"
      ENABLE_SCHEDULER: "true"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./imports:/app/imports:ro
    mem_limit: 512m
    restart: unless-stopped
