services:
  jobradar:
    # 'image' is the registry tag used by CI (docker compose pull).
    # 'build' is kept so local dev can still run docker compose up --build.
    # Production deploy: docker compose pull && docker compose up -d
    image: ghcr.io/manasjoshi1/jobradar:latest
    build: .
    container_name: jobradar
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Non-secret runtime defaults — override in .env for production
      DATABASE_URL: "file:/app/data/jobradar.db"
      NODE_ENV: "production"
      NODE_OPTIONS: "--max-old-space-size=640"
      CONFIG_DIR: "/app/config"
      ENABLE_SCHEDULER: "true"
    volumes:
      - ./data:/app/data
      - ./config:/app/config:ro
      - ./imports:/app/imports:ro
    mem_limit: 750m
    memswap_limit: 750m
    restart: unless-stopped
